<div class="modal add-products-modal" tabindex="-1" role="dialog" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content" style="width: 400px; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);">

      <div class="modal-header">
        <button type="button" class="close" aria-label="Close" ng-click="$hide()">
          <span aria-hidden="true">&times;</span>
        </button>
        <h4 class="modal-title">
          {{'dispensingPatientVitalsModal.title' | message}}
        </h4>
      </div>

      <div class="modal-body">
<!-- ///////////////////////////////////////////// -->
        <!-- <div class="col-sm-3"> -->
            <form name="newPatientForm4" class="content" ng-submit="vm.submitPatientData()">
                <fieldset class="form-group">
                    <label for="nextOfKinNames">{{'dispensingPatientVitalsModal.height' | message}}</label>
                    <input id="nextOfKinNames" ng-model="vm.patient.height" type="text" />
                </fieldset>
                <fieldset class="form-group">
                    <label for="nextOfKinContact">{{'dispensingPatientVitalsModal.weight' | message}}</label>
                    <input id="nextOfKinContact" ng-model="vm.patient.weight" type="text" />

                </fieldset>

                <fieldset class="form-group">
                    <label for="tbStatus">{{'dispensingPatientVitalsModal.tbStatus' | message}}</label>
                    <select id="tbStatus" ng-model="vm.tbStatus"
                        ng-options="option for option in  vm.tbStatusOptions"></select>
                </fieldset>

                <fieldset class="form-group">
                    <label for="nextOfKinNames">{{'dispensingPatientVitalsModal.systolic' | message}}</label>
                    <input id="nextOfKinNames" ng-model="vm.patient.systolic" type="text" />
                </fieldset>
                <fieldset class="form-group">
                    <label for="nextOfKinContact">{{'dispensingPatientVitalsModal.diastolic' | message}}</label>
                    <input id="nextOfKinContact" ng-model="vm.patient.diastolic" type="text" />
                </fieldset>
                <fieldset class="form-group">
                    <label for="nextOfKinNames">{{'dispensingPatientVitalsModal.muac' | message}}</label>
                    <input id="nextOfKinNames" ng-model="vm.patient.muac" type="text" />

                </fieldset>
            </form>
        <!-- </div> -->
<!-- /////////////////////////////////////////////////////////// -->
      </div>

      <div>
        <fieldset class="form-group">
          <p>.</p>
          <!-- <p> </p><p> </p><p> </p> -->
        </fieldset>
      </div>

      <div class="modal-footer">
        <button ng-click="$hide()">{{'dispensingPatientVitalsModal.cancel' | message}}</button>
        <button ng-click="vm.confirm()" class="primary">
          {{'dispensingPatientVitalsModal.save' | message}}
        </button>
      </div>

    </div>
  </div>
</div>
